# Parity cases: the same CLI arguments are rendered by the C reference and the PyTorch
# CLI, and the two float images compared (Pearson r, sum ratio, max abs difference).
#
# C reference ("the oracle"): bl831/main plus fix/phi0-stale-rotation,
# fix/subpixel-oversampling and fix/curved-det-flag-guard, the three unmerged branches
# bl831's own GPU harness uses as its CPU reference. Rebuild it with
# scripts/oracle/build_oracle.sh, which pins the merged nanoBragg.c to
# md5 0a8675a1ce4b19e0d0039542e1a2099d (bl831/main 0d24e6e, 2026-08-04) and builds with
# -O2 -fno-fast-math -ffp-contract=off. Thresholds below were measured against that build;
# if the checksum warning fires, re-measure before trusting them.
#
cases:
  - id: AT-PARALLEL-001
    description: Beam center scaling parity (C ↔ PyTorch)
    base_args: >-
      -default_F 100
      -cell 100 100 100 90 90 90
      -lambda 6.2
      -N 3
      -pixel 0.1
      -distance 100
      -mosflm
      -seed 1
    thresholds:
      corr_min: 0.9999
      sum_ratio_min: 0.9
      sum_ratio_max: 1.1
      max_abs_max: 500
    runs:
      - name: detpixels-64
        extra_args: >-
          -detpixels 64
          -Xbeam 3.2
          -Ybeam 3.2
      - name: detpixels-128
        extra_args: >-
          -detpixels 128
          -Xbeam 6.4
          -Ybeam 6.4
      - name: detpixels-256
        extra_args: >-
          -detpixels 256
          -Xbeam 12.8
          -Ybeam 12.8
      - name: detpixels-512
        extra_args: >-
          -detpixels 512
          -Xbeam 25.6
          -Ybeam 25.6

