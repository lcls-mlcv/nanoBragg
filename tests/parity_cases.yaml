  - id: AT-PARALLEL-024
    description: Random misset reproducibility and equivalence (C ↔ PyTorch)
    base_args: >-
      -default_F 100
      -cell 100 100 100 90 90 90
      -lambda 1.0
      -N 5
      -detpixels 256
      -pixel 0.1
      -distance 100
      -mosflm
      -phi 0
      -osc 0
      -mosaic 0
      -oversample 1
    # -misset_seed goes first: nanoBragg.c's strstr() parser reads a later "-misset_seed N"
    # as "-misset N <next> <next>" and silently drops the random orientation. -seed does not
    # seed the random misset in C (misset_seed is copied from the time-based seed before argv
    # is parsed), so only -misset_seed gives a reproducible C reference.
    thresholds:
      corr_min: 0.9999
      sum_ratio_min: 0.999
      sum_ratio_max: 1.001
    runs:
      - name: random-misset-seed-12345
        extra_args: >-
          -misset_seed 12345
          -misset random
      - name: random-misset-seed-54321
        extra_args: >-
          -misset_seed 54321
          -misset random
      - name: random-misset-seed-1
        extra_args: >-
          -misset_seed 1
          -misset random

  - id: AT-PARALLEL-010
    description: Solid angle corrections parity (C ↔ PyTorch)
    base_args: >-
      -default_F 100
      -cell 100 100 100 90 90 90
      -lambda 6.2
      -N 5
      -distance 100
      -pixel 0.1
      -detpixels 256
      -mosflm
      -phi 0
      -osc 0
      -mosaic 0
      -oversample 1
      -seed 1
    # point_pixel drops the pixel-area factor, so intensities here are ~1e11 and an absolute
    # max-difference budget of 500 is meaningless: these runs sit at corr = 1.000000 and
    # sum_ratio = 1.0000 with a worst pixel differing by ~1e-6 of the peak. Bound it relatively.
    thresholds:
      corr_min: 0.98
      sum_ratio_min: 0.9
      sum_ratio_max: 1.1
      max_abs_max: 500
    runs:
      # Mode A: point_pixel ON (1/R² scaling)
      - name: point-pixel-distance-50mm
        extra_args: >-
          -distance 50
          -point_pixel
        # point_pixel drops the pixel-area factor: intensities are ~1e11 here, so an absolute
        # budget of 500 is meaningless. corr = 1.000000 and sum_ratio = 1.0000 on these runs;
        # the worst pixel is 6e-7 (400 mm), 1.7e-5 (100 mm) and 2.6e-5 (50 mm) of the peak.
        thresholds:
          corr_min: 0.9999
          sum_ratio_min: 0.999
          sum_ratio_max: 1.001
          max_rel_max: 5.0e-5
      - name: point-pixel-distance-100mm
        extra_args: >-
          -distance 100
          -point_pixel
        # point_pixel drops the pixel-area factor: intensities are ~1e11 here, so an absolute
        # budget of 500 is meaningless. corr = 1.000000 and sum_ratio = 1.0000 on these runs;
        # the worst pixel is 6e-7 (400 mm), 1.7e-5 (100 mm) and 2.6e-5 (50 mm) of the peak.
        thresholds:
          corr_min: 0.9999
          sum_ratio_min: 0.999
          sum_ratio_max: 1.001
          max_rel_max: 5.0e-5
      - name: point-pixel-distance-200mm
        extra_args: >-
          -distance 200
          -point_pixel
        # Same as the other point_pixel runs (corr = 1.000000, sum_ratio = 1.0000), but one
        # corner pixel (253, 0) differs by 0.16%% of its own value, 1.0e-3 of the peak, where
        # the other distances stay at 6e-7 to 2.6e-5. An isolated high-angle residual, not
        # rounding; bounded loosely here so it cannot grow while it is investigated.
        thresholds:
          corr_min: 0.9999
          sum_ratio_min: 0.999
          sum_ratio_max: 1.001
          max_rel_max: 2.0e-3
      - name: point-pixel-distance-400mm
        extra_args: >-
          -distance 400
          -point_pixel
        # point_pixel drops the pixel-area factor: intensities are ~1e11 here, so an absolute
        # budget of 500 is meaningless. corr = 1.000000 and sum_ratio = 1.0000 on these runs;
        # the worst pixel is 6e-7 (400 mm), 1.7e-5 (100 mm) and 2.6e-5 (50 mm) of the peak.
        thresholds:
          corr_min: 0.9999
          sum_ratio_min: 0.999
          sum_ratio_max: 1.001
          max_rel_max: 5.0e-5
      # Mode B: point_pixel OFF (obliquity with tilts)
      - name: obliquity-distance-100mm-tilt-0deg
        extra_args: >-
          -distance 100
      - name: obliquity-distance-100mm-tilt-10deg
        extra_args: >-
          -distance 100
          -detector_rotx 10
      - name: obliquity-distance-100mm-tilt-20deg
        extra_args: >-
          -distance 100
          -detector_rotx 20
      - name: obliquity-distance-100mm-tilt-30deg
        extra_args: >-
          -distance 100
          -detector_rotx 30

  - id: AT-PARALLEL-016
