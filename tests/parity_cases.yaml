  - id: PARITY-PIVOT-001
    description: >-
      Detector pivot selection and pre-twotheta beam·odet ratio (C ↔ PyTorch).
      nanoBragg.c overwrites the pivot in argv order, then forces BEAM for MOSFLM/DENZO/ADXV
      and SAMPLE for XDS/DIALS; only CUSTOM keeps the parsed pivot. ratio = beam·odet is
      taken after rotx/y/z but before the twotheta swing (nanoBragg.c:1709-1713).
    base_args: >-
      -default_F 100
      -cell 70 80 90 75 85 95
      -misset 10 20 30
      -lambda 1.0
      -N 5
      -pixel 0.1
      -detpixels 128
      -oversample 1
    thresholds:
      corr_min: 0.9999
      sum_ratio_min: 0.999
      sum_ratio_max: 1.001
    runs:
      - name: mosflm-twotheta-beam-pivot
        extra_args: >-
          -distance 100
          -twotheta 10
      - name: mosflm-pivot-sample-ignored
        extra_args: >-
          -distance 100
          -twotheta 10
          -pivot sample
      - name: mosflm-close-distance-twotheta-rotations
        extra_args: >-
          -close_distance 95
          -detector_rotx 3
          -detector_roty 2
          -twotheta 12
      - name: xds-twotheta-sample-pivot
        extra_args: >-
          -xds
          -distance 100
          -twotheta 10
      - name: dials-pivot-beam-ignored
        extra_args: >-
          -dials
          -distance 100
          -detector_roty 4
          -twotheta 8
          -pivot beam
      - name: custom-twotheta-last-sample
        extra_args: >-
          -fdet_vector 0 0 1
          -sdet_vector 0 -1 0
          -odet_vector 1 0 0
          -beam_vector 1 0 0
          -distance 100
          -detector_rotz 3
          -twotheta 10
      - name: custom-distance-last-beam
        extra_args: >-
          -fdet_vector 0 0 1
          -sdet_vector 0 -1 0
          -odet_vector 1 0 0
          -beam_vector 1 0 0
          -twotheta 10
          -detector_rotz 3
          -distance 100
      - name: custom-close-distance-twotheta
        extra_args: >-
          -fdet_vector 0 0 1
          -sdet_vector 0 -1 0
          -odet_vector 1 0 0
          -beam_vector 1 0 0
          -detector_rotx 5
          -close_distance 95
          -twotheta 12
  - id: PARITY-THICK-001
    description: >-
      Detector sensor layers (C ↔ PyTorch). nanoBragg.c renders each layer at the pixel
      position shifted t*step along odet, sums F^2 over layers without dividing by the layer
      count, and scales by the last layer's capture fraction (or per sample with
      -oversample_thick). -thicksteps N means N >= 2 layers T/(N-1) apart; no -thicksteps
      means 2 layers T/2 apart; no -detector_abs means mu = 1/T.
    base_args: >-
      -default_F 100
      -cell 70 80 90 75 85 95
      -misset 10 20 30
      -lambda 1.0
      -N 5
      -pixel 0.1
      -distance 100
      -detpixels 128
    thresholds:
      corr_min: 0.9999
      sum_ratio_min: 0.999
      sum_ratio_max: 1.001
    runs:
      - name: thick-no-thicksteps
        extra_args: >-
          -detector_thick 100
          -detector_abs 500
          -oversample 1
      - name: thicksteps-1
        extra_args: >-
          -detector_thick 100
          -detector_abs 500
          -thicksteps 1
          -oversample 1
      - name: thicksteps-5
        extra_args: >-
          -detector_thick 100
          -detector_abs 500
          -thicksteps 5
          -oversample 1
      - name: thicksteps-4-oversample-2
        extra_args: >-
          -detector_thick 450
          -detector_abs 300
          -thicksteps 4
          -oversample 2
      - name: thicksteps-4-oversample-thick
        extra_args: >-
          -detector_thick 450
          -detector_abs 300
          -thicksteps 4
          -oversample 2
          -oversample_thick
      - name: default-attenuation-depth
        extra_args: >-
          -detector_thick 200
          -thicksteps 3
          -oversample 1
      - name: tilted-detector
        extra_args: >-
          -detector_thick 300
          -detector_abs 200
          -thicksteps 3
          -detector_rotx 10
          -detector_roty 15
          -oversample 1

  - id: PARITY-SHAPE-001
    description: >-
      Crystal shape models against C with the default spot metric (C ↔ PyTorch). GAUSS and
      TOPHAT use bl831's reciprocal-space rad_star radius; ROUND uses the hkl-space one.
      The cell is triclinic on purpose: the two metrics coincide only for a cubic cell, so
      these runs fail if SpotMetric.HKL ever becomes the default.
    base_args: >-
      -default_F 100
      -cell 70 80 90 75 85 95
      -misset 10 20 30
      -lambda 1.0
      -N 5
      -pixel 0.1
      -distance 100
      -detpixels 128
      -oversample 1
    thresholds:
      corr_min: 0.9999
      sum_ratio_min: 0.999
      sum_ratio_max: 1.001
    runs:
      - name: square
        extra_args: >-
          -square_xtal
      - name: round
        extra_args: >-
          -round_xtal
      - name: gauss
        extra_args: >-
          -gauss_xtal
      - name: tophat
        extra_args: >-
          -tophat_spots
        # A binary cutoff aliases at the spot edge: 3-4 of ~4300 lit pixels sit on opposite
        # sides of "rad_sqr*fudge < 0.3969" in the two programs. r rises to 0.99997 at
        # oversample 4, so this is sampling, not a metric difference.
        thresholds:
          corr_min: 0.999
          sum_ratio_min: 0.998
          sum_ratio_max: 1.002
      - name: tophat-oversample-4
        extra_args: >-
          -tophat_spots
          -oversample 4
        thresholds:
          corr_min: 0.9999
          sum_ratio_min: 0.999
          sum_ratio_max: 1.002
      - name: gauss-fudge
        extra_args: >-
          -gauss_xtal
          -fudge 1.5

  - id: PARITY-SHAPE-002
    description: >-
      Anisotropic N_cells with each shape (C ↔ PyTorch). No -N here: nanoBragg.c takes the
      last N flag in argv order, while the PyTorch CLI lets -N win over -Na/-Nb/-Nc, so
      mixing them is a separate parity bug tracked outside this case.
    base_args: >-
      -default_F 100
      -cell 70 80 90 75 85 95
      -misset 10 20 30
      -lambda 1.0
      -Na 4
      -Nb 7
      -Nc 9
      -pixel 0.1
      -distance 100
      -detpixels 128
      -oversample 1
    thresholds:
      corr_min: 0.9999
      sum_ratio_min: 0.999
      sum_ratio_max: 1.001
    runs:
      - name: square
        extra_args: >-
          -square_xtal
      - name: round
        extra_args: >-
          -round_xtal
      - name: gauss
        extra_args: >-
          -gauss_xtal

  - id: PARITY-NCELLS-001
    description: >-
      N_cells flag handling (C ↔ PyTorch). nanoBragg.c defaults Na=Nb=Nc=1 and applies each
      N flag to its own axis in argv order, so a later -Na beats an earlier -N and a run
      with no N flags is a 1x1x1 crystal.
    base_args: >-
      -default_F 100
      -cell 70 80 90 75 85 95
      -misset 10 20 30
      -lambda 1.0
      -pixel 0.1
      -distance 100
      -detpixels 128
      -oversample 1
    thresholds:
      corr_min: 0.9999
      sum_ratio_min: 0.999
      sum_ratio_max: 1.001
    runs:
      - name: no-N-flags-defaults-to-1
        extra_args: >-
      - name: Na-only
        extra_args: >-
          -Na 4
      - name: per-axis
        extra_args: >-
          -Na 4 -Nb 7 -Nc 9
      - name: N-then-Na
        extra_args: >-
          -N 5 -Na 4
      - name: Na-then-N
        extra_args: >-
          -Na 4 -N 5

  - id: PARITY-WATER-001
    description: >-
      Water background (C ↔ PyTorch). nanoBragg.c seeds each pixel with I = I_bg and then
      adds the Bragg terms, so the background is scaled by r_e^2*fluence a second time,
      divided by steps, and multiplied by the cached polarization factor, the solid angle
      and the capture fraction. Its polarization and omega come from the first subpixel of
      the front layer, which is why the oversampled runs are here.
    base_args: >-
      -default_F 100
      -cell 70 80 90 75 85 95
      -misset 10 20 30
      -lambda 1.0
      -N 5
      -pixel 0.1
      -distance 100
      -detpixels 128
    thresholds:
      corr_min: 0.9999
      sum_ratio_min: 0.999
      sum_ratio_max: 1.001
    runs:
      - name: water-100um
        extra_args: >-
          -water 100
          -oversample 1
      - name: water-500um
        extra_args: >-
          -water 500
          -oversample 1
      - name: water-oversample-3
        extra_args: >-
          -water 100
          -oversample 3
      - name: water-polarized
        extra_args: >-
          -water 100
          -polar 0.5
          -oversample 3
      - name: water-nopolar
        extra_args: >-
          -water 100
          -nopolar
          -oversample 1
      - name: water-with-sensor-layers
        extra_args: >-
          -water 100
          -detector_thick 450
          -detector_abs 300
          -thicksteps 3
          -oversample 2

  - id: PARITY-FLUX-001
    description: >-
      Fluence from flux/exposure/beamsize (C ↔ PyTorch). nanoBragg.c defaults to
      exposure = 1 s and beamsize = 0.1 mm and computes fluence = flux*exposure/beamsize^2
      whenever flux != 0, so -flux alone changes the scale and overrides an explicit
      -fluence. These runs differ in absolute scale by ~9 orders of magnitude.
    base_args: >-
      -default_F 100
      -cell 70 80 90 75 85 95
      -misset 10 20 30
      -lambda 1.0
      -N 5
      -pixel 0.1
      -distance 100
      -detpixels 128
      -oversample 1
    thresholds:
      corr_min: 0.9999
      sum_ratio_min: 0.999
      sum_ratio_max: 1.001
    runs:
      - name: default-fluence
        extra_args: >-
      - name: flux-only
        extra_args: >-
          -flux 1e12
      - name: flux-and-exposure
        extra_args: >-
          -flux 1e12
          -exposure 2
      - name: flux-and-beamsize
        extra_args: >-
          -flux 1e12
          -beamsize 0.05
      - name: flux-exposure-beamsize
        extra_args: >-
          -flux 1e12
          -exposure 0.5
          -beamsize 0.2
      - name: explicit-fluence
        extra_args: >-
          -fluence 1e24
      - name: flux-overrides-fluence
        extra_args: >-
          -fluence 1e24
          -flux 1e12

  - id: PARITY-DENZO-001
    description: >-
      DENZO detector convention (C ↔ PyTorch). nanoBragg.c:1204-1218 makes DENZO
      identical to MOSFLM -- beam_vector [1,0,0], fdet [0,0,1], sdet [0,-1,0],
      odet [1,0,0], twotheta_axis [0,0,-1], polar_vector [0,0,1],
      spindle_vector [0,0,1], BEAM pivot, default Xbeam/Ybeam = (detsize+pixel)/2 --
      except for the beam-centre offset: Fbeam = Ybeam + 0.0*pixel and
      Sbeam = Xbeam + 0.0*pixel where MOSFLM uses + 0.5*pixel. PyTorch used to fall
      through to the [0,0,1] beam vector for DENZO, which put the beam in the
      detector plane and produced an all-zero image (sum ratio 0.0).
    base_args: >-
      -default_F 100
      -cell 70 80 90 75 85 95
      -misset 10 20 30
      -lambda 1.0
      -N 5
      -pixel 0.1
      -distance 100
      -detpixels 128
      -oversample 1
      -denzo
    thresholds:
      corr_min: 0.9999
      sum_ratio_min: 0.999
      sum_ratio_max: 1.001
    runs:
      - name: denzo-default-beam-center
        extra_args: >-
      - name: denzo-explicit-beam-center
        extra_args: >-
          -Xbeam 5.0
          -Ybeam 7.5
      - name: denzo-detector-rotations
        extra_args: >-
          -detector_rotx 3
          -detector_roty -2
          -detector_rotz 1
      - name: denzo-twotheta
        extra_args: >-
          -twotheta 20
      - name: denzo-twotheta-explicit-beam-center
        extra_args: >-
          -twotheta 20
          -Xbeam 5.0
          -Ybeam 7.5
      - name: denzo-twotheta-and-rotations
        extra_args: >-
          -twotheta -10
          -detector_rotx 5
      - name: denzo-close-distance
        extra_args: >-
          -close_distance 95

  - id: PARITY-CONVENTION-001
    description: >-
      Convention table pinned against nanoBragg.c:1172-1248, one run per convention.
      MOSFLM/DENZO: beam [1,0,0], f [0,0,1], s [0,-1,0], o [1,0,0],
      twotheta_axis [0,0,-1], BEAM pivot (DENZO drops MOSFLM's +0.5 pixel offset).
      XDS: beam [0,0,1], f [1,0,0], s [0,1,0], o [0,0,1], twotheta_axis [1,0,0],
      SAMPLE pivot. DIALS: same bases as XDS but twotheta_axis [0,1,0], SAMPLE pivot.
      ADXV (beam [0,0,1], f [1,0,0], s [0,-1,0], o [0,0,1], twotheta_axis [-1,0,0],
      Fbeam = Xbeam, Sbeam = detsize_s - Ybeam, BEAM pivot) is pinned only with an
      explicit beam centre: PyTorch's ADXV *default* beam centre is still one pixel
      off on the slow axis (it uses Sbeam = (detsize_s - pixel)/2 where C computes
      Sbeam = detsize_s - Ybeam = (detsize_s + pixel)/2), which is a separate
      unfixed bug and deliberately not pinned here.
    base_args: >-
      -default_F 100
      -cell 70 80 90 75 85 95
      -misset 10 20 30
      -lambda 1.0
      -N 5
      -pixel 0.1
      -distance 100
      -detpixels 128
      -oversample 1
    thresholds:
      corr_min: 0.9999
      sum_ratio_min: 0.999
      sum_ratio_max: 1.001
    runs:
      - name: mosflm-default
        extra_args: >-
          -mosflm
      - name: mosflm-explicit-beam-center
        extra_args: >-
          -mosflm
          -Xbeam 5.0
          -Ybeam 7.5
      - name: denzo-default
        extra_args: >-
          -denzo
      - name: denzo-explicit-beam-center
        extra_args: >-
          -denzo
          -Xbeam 5.0
          -Ybeam 7.5
      - name: xds-default
        extra_args: >-
          -xds
      - name: xds-twotheta
        extra_args: >-
          -xds
          -twotheta 20
      - name: dials-default
        extra_args: >-
          -dials
      - name: dials-twotheta
        extra_args: >-
          -dials
          -twotheta 20
      - name: adxv-explicit-beam-center
        extra_args: >-
          -adxv
          -Xbeam 5.0
          -Ybeam 7.5

  - id: PARITY-CONVENTION-002
    description: >-
      Per-convention polarization E-vector and spindle axis (C ↔ PyTorch). Each convention
      block in nanoBragg.c sets polar_vector and spindle_vector alongside the detector basis:
      MOSFLM and DENZO use [0,0,1], XDS and ADXV [1,0,0], DIALS [0,1,0]. A wrong spindle axis
      only shows once phi rotates (it was r = 0.55 for XDS/DIALS/ADXV), and a wrong
      polarization axis only once the Kahn factor is non-zero.
    base_args: >-
      -default_F 100
      -cell 70 80 90 75 85 95
      -misset 10 20 30
      -lambda 1.0
      -N 5
      -pixel 0.1
      -distance 100
      -detpixels 128
      -oversample 1
    thresholds:
      corr_min: 0.9999
      sum_ratio_min: 0.999
      sum_ratio_max: 1.001
    runs:
      - name: mosflm-polarized
        extra_args: >-
          -mosflm
          -polar 0.9
      - name: denzo-polarized
        extra_args: >-
          -denzo
          -polar 0.9
      - name: xds-polarized
        extra_args: >-
          -xds
          -polar 0.9
      - name: dials-polarized
        extra_args: >-
          -dials
          -polar 0.9
      - name: adxv-polarized
        extra_args: >-
          -adxv
          -polar 0.9
      - name: mosflm-phi
        extra_args: >-
          -mosflm
          -phi 0 -osc 6 -phisteps 3
      - name: xds-phi
        extra_args: >-
          -xds
          -phi 0 -osc 6 -phisteps 3
      - name: dials-phi
        extra_args: >-
          -dials
          -phi 0 -osc 6 -phisteps 3
      - name: adxv-phi
        extra_args: >-
          -adxv
          -phi 0 -osc 6 -phisteps 3
      - name: adxv-default-beam-centre
        extra_args: >-
          -adxv
      - name: adxv-default-beam-centre-rotated
        extra_args: >-
          -adxv
          -detector_rotx 4
          -twotheta 15
  - id: PARITY-CURVED-001
    description: >-
      Curved detector (C ↔ PyTorch). With -curved_det nanoBragg.c:2707-2716 throws away the
      planar pixel_pos and rebuilds it as distance*beam_vector rotated twice:
      rotate_axis about sdet_vector by pixel_pos[2]/distance, then about fdet_vector by
      pixel_pos[3]/distance. The angles are the LAB-FRAME Y and Z components of the planar
      position (so they include pix0_vector, i.e. the beam centre), both read from the planar
      pixel_pos, and the whole thing happens inside the sensor-layer / sub-pixel loop, so
      every sub-pixel and layer is mapped separately. Every pixel ends up exactly "distance"
      from the sample.
    base_args: >-
      -default_F 100
      -cell 70 80 90 75 85 95
      -misset 10 20 30
      -lambda 1.0
      -N 5
      -pixel 0.1
      -distance 100
      -detpixels 128
      -curved_det
    thresholds:
      corr_min: 0.9999
      sum_ratio_min: 0.999
      sum_ratio_max: 1.001
    runs:
      - name: curved-plain
        extra_args: >-
          -oversample 1
      - name: curved-oversample-3
        extra_args: >-
          -oversample 3
      - name: curved-detector-rotations
        extra_args: >-
          -detector_rotx 5
          -detector_roty 3
          -detector_rotz 2
          -oversample 1
      - name: curved-rotations-oversample-2
        extra_args: >-
          -detector_rotx 5
          -detector_roty 3
          -detector_rotz 2
          -oversample 2
      - name: curved-twotheta-20
        extra_args: >-
          -twotheta 20
          -oversample 1
      - name: curved-offset-beam-center
        extra_args: >-
          -Xbeam 3.0
          -Ybeam 10.0
          -oversample 1
      - name: curved-thick-layers
        extra_args: >-
          -detector_thick 300
          -detector_abs 200
          -thicksteps 3
          -oversample 2

  - id: PARITY-MOSAIC-001
    description: >-
      Mosaic domain orientations (C ↔ PyTorch). nanoBragg.c draws each domain from a
      spherical cap with ran1, keeping one seed state across the set (three deviates per
      domain) and forcing domain 0 to the identity after its draws are taken. It also
      resolves the flags together: a spread with no -mosaic_dom is rendered with 10 domains,
      and a zero spread forces one domain. torch previously sampled Gaussian axes and angles
      from its own RNG, which matched only statistically (r ~ 0.94 for 10 domains).
    base_args: >-
      -default_F 100
      -cell 70 80 90 75 85 95
      -misset 10 20 30
      -lambda 1.0
      -N 5
      -pixel 0.1
      -distance 100
      -detpixels 128
      -oversample 1
    thresholds:
      corr_min: 0.9999
      sum_ratio_min: 0.999
      sum_ratio_max: 1.001
    runs:
      - name: spread-only-ups-to-10-domains
        extra_args: >-
          -mosaic 1.0
      - name: ten-domains
        extra_args: >-
          -mosaic 1.0
          -mosaic_dom 10
      - name: explicit-seed
        extra_args: >-
          -mosaic 1.0
          -mosaic_dom 10
          -mosaic_seed 12345
      - name: fifty-domains
        extra_args: >-
          -mosaic 2.0
          -mosaic_dom 50
      - name: small-spread-seeded
        extra_args: >-
          -mosaic 0.5
          -mosaic_dom 25
          -mosaic_seed 777
      - name: zero-spread-forces-one-domain
        extra_args: >-
          -mosaic 0.0
          -mosaic_dom 10
      - name: mosaic-with-phi
        extra_args: >-
          -mosaic 1.0
          -mosaic_dom 10
          -phi 0 -osc 5 -phisteps 3
