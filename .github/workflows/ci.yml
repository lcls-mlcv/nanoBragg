name: CI

# CPU-only: the C parity matrix against the bl831 oracle, the rest of the suite
# (CLI subprocesses, gradient-health sweep), and the gradcheck file in its own step.
# Python 3.12 and 3.14 both run because version splits have caught real bugs before.

on:
  push:
    branches: [torch]
  pull_request:
    branches: [torch]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    env:
      KMP_DUPLICATE_LIB_OK: "TRUE"
      # Eager mode: torch.compile warm-up would dominate a CPU CI run.
      NANOBRAGG_DISABLE_COMPILE: "1"
      NB_RUN_GRAD_SWEEP: "1"
      OMP_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache C oracle
        id: oracle-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/oracle
          key: oracle-${{ runner.os }}-${{ hashFiles('scripts/oracle/build_oracle.sh') }}

      - name: Build C oracle (bl831/main + fix branches)
        if: steps.oracle-cache.outputs.cache-hit != 'true'
        run: scripts/oracle/build_oracle.sh "$RUNNER_TEMP/oracle"

      - name: Point tests at the oracle
        run: |
          echo "NB_C_BIN=$RUNNER_TEMP/oracle/nanoBragg" >> "$GITHUB_ENV"
          cat "$RUNNER_TEMP/oracle/ORACLE_PROVENANCE"

      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[test]"
          python -c "import torch, sys; print('python', sys.version.split()[0], 'torch', torch.__version__)"

      - name: Parity matrix vs C
        # NB_RUN_PARALLEL only here: it also enables the legacy AT-PARALLEL C comparisons,
        # 7 of which fail on torch d07a057 (stale harness API, test-design issues). Those
        # are tracked separately; the parity matrix is the canonical C check.
        env:
          NB_RUN_PARALLEL: "1"
        run: python -m pytest -q -p no:cacheprovider tests/test_parity_matrix.py

      - name: Test suite
        run: >
          python -m pytest -q -p no:cacheprovider tests
          --ignore=tests/test_parity_matrix.py --ignore=tests/test_gradients.py -rfE

      - name: Gradcheck suite
        run: python -m pytest -q -p no:cacheprovider tests/test_gradients.py -rfE
